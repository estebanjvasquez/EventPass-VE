name = "eventpass-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Wrangler validará estos secretos antes de publicar una versión.
[secrets]
required = ["OPENAI_API_KEY", "SUPABASE_SERVICE_ROLE_KEY"]

# Recordatorios de pago y liberación de plazas vencidas.
# Reemplaza a Bull/Redis del stack anterior.
[triggers]
crons = ["0 * * * *"]

# Binding nativo de Cloudflare Email Sending (no requiere API key).
# Requiere plan Workers Paid y el dominio remitente verificado en el dashboard
# (Email → Email Sending). El remitente debe pertenecer a ese dominio.
[[send_email]]
name = "EMAIL"

# Variables no secretas. Los secretos se cargan con:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
[vars]
SUPABASE_URL = "https://moqywmcbklaeaelttzdm.supabase.co"
ENVIRONMENT = "production"
# Remitente (dominio verificado en Cloudflare) y URL pública del frontend.
EMAIL_FROM = "welcome@eventosfacil.net"
APP_BASE_URL = "https://eventosfacil.net"
# La clave OPENAI_API_KEY se carga sólo con `wrangler secret put`.
# Este modelo es una variable no secreta y puede cambiarse tras validar coste/calidad.
OPENAI_MODEL = "gpt-5.4-mini"
# Foro: interpretación estructurada de instrucciones. Exposición: visión de
# alta precisión para localizar objetos individuales en blueprints.
OPENAI_FORUM_MODEL = "gpt-5.4-mini"
OPENAI_VISION_MODEL = "gpt-5.4"

# Aprovisionamiento de subdominios de tenant vía la API de Cloudflare Pages.
# El secreto CF_API_TOKEN (token con permiso "Cloudflare Pages: Edit") se carga con:
#   wrangler secret put CF_API_TOKEN
CF_ACCOUNT_ID = "cb77662770c0955288691715afa25690"
CF_PAGES_PROJECT = "eventpass"
ROOT_DOMAIN = "eventosfacil.net"
# Habilitan la creación automática del registro DNS del subdominio
# (CNAME <slug> -> CF_PAGES_HOST, proxied). Requiere que CF_API_TOKEN tenga
# permiso "Zone.DNS: Edit" sobre la zona. Si el token no lo tiene, la parte
# DNS se omite y se confía en un registro wildcard.
CF_ZONE_ID = "627e78510f507ae70e87129eea65e5d1"
CF_PAGES_HOST = "eventpass-d7d.pages.dev"
